# The Rust gate. Standalone rather than an arm of ci.yml, because ci.yml
# calls the org-shared polyglot workflow and that takes no Rust input:
# running this file needs no change in tabnas/.github.
name: Rust

# Runs on EVERY branch push, not just main, and the path lists are
# written out twice.
#
# Both are deliberate, for the reasons docs.yml records: GitHub Actions
# has no YAML anchors, so a version sharing one list between the two
# triggers does not run at all; and restricting `push` to main while
# leaning on `pull_request` leaves a gate that reaches a pull request
# green because it never executed.
on:
  # `branches` is set explicitly. A `push` trigger that names neither
  # branches nor tags also matches TAG pushes, and Actions does not
  # evaluate `paths` for a tag ref -- so without this, release.yml
  # pushing `ts/v…` and `go/v…` would run this whole gate once per tag,
  # on a ref where the path filters mean nothing.
  push:
    branches: [ '**' ]
    paths:
      - 'rs/**'
      - 'ts/src/**'
      - 'ts/package.json'
      - 'ci/rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rs/**'
      - 'ts/src/**'
      - 'ts/package.json'
      - 'ci/rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # Checked out into a NAMED directory. rs/Cargo.toml takes the
      # engine as `path = "../../parser/rs"`, which resolves relative to
      # rs/, so the engine has to sit beside this checkout rather than
      # inside it. A bare `actions/checkout` into the workspace root
      # leaves nowhere for the sibling to go.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: bnf

      # Engine main, not a release: the crate is unpublished, so this is
      # the only resolution there is. It is also the one CI already uses
      # for Go, so both ports are measured against the same engine.
      - name: Clone the sibling engine
        run: git clone --depth 1 https://github.com/tabnas/parser.git parser

      # Pinned to the MSRV in rs/Cargo.toml rather than to `stable`, so
      # this fails on a change that needs a newer compiler instead of
      # passing here and breaking for anyone honouring rust-version.
      # rustup, NOT dtolnay/rust-toolchain: these repos allow only
      # GitHub-owned and verified-creator actions (allowed_actions:
      # selected, patterns_allowed: []), so that action is refused before
      # any job starts -- the run reports startup_failure, which reads as
      # a broken workflow file rather than a blocked action. The runners
      # ship rustup, so the action was buying nothing here.
      #
      # `default` is what makes the MSRV the toolchain the gate runs
      # under; installing it alone leaves cargo on the runner's
      # pre-installed stable.
      - name: Set up Rust MSRV
        run: |
          rustup toolchain install 1.85 --profile minimal --component rustfmt,clippy
          rustup default 1.85

      # Everything lives in the script so this file and a contributor's
      # local run cannot say different things.
      - name: Rust gate
        run: bnf/ci/rust/run.sh
