[package]
name = "tabnas-bnf"
version = "0.1.28"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Shared compiler for BNF-family grammar front-ends on the tabnas parser: grammar IR in, tabnas GrammarSpec out"
repository = "https://github.com/tabnas/bnf"

[lib]
name = "tabnas_bnf"
path = "src/lib.rs"

[dependencies]
# The engine is consumed as a SIBLING CHECKOUT, the standard tabnas
# development model: clone https://github.com/tabnas/parser next to this
# repo. The engine is on crates.io as tabnas-parser, but this committed
# manifest stays path-only, so there is no registry version to fall back
# on here; crates-release.yml rewrites the path into a crates.io
# requirement when it publishes this crate.
tabnas = { package = "tabnas-parser", path = "../../parser/rs" }
indexmap = { version = "2.2", features = ["serde"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
